<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reto 2</title>

<style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#1f2937;--muted:#667085;--border:#d7deea;--blue:#214f93;--teal:#0f766e;--soft:#eef4ff;--success:#eaf8ef;--warning:#fff6dd}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
body{display:flex}
.app{width:100%;height:100vh;padding:14px;display:flex;flex-direction:column;gap:10px}
.header{background:#fff;border:1px solid var(--border);border-radius:16px;padding:11px 14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;flex:0 0 auto}
.badge{display:inline-block;background:var(--soft);color:var(--blue);border-radius:999px;padding:4px 8px;font-size:11px;font-weight:bold}
h1{margin:4px 0 0;font-size:21px;color:#173b72}
.status{font-size:13px;color:var(--muted);text-align:right}
.progress{margin-top:5px;width:170px;height:8px;border-radius:999px;background:#e5eaf2;overflow:hidden}
.progress div{height:100%;background:var(--teal)}
.stage{flex:1;min-height:0;background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.inner{width:100%;max-width:820px}
.head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.num{width:40px;height:40px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:0 0 auto}
h2{margin:0;font-size:22px}.topic{font-size:13px;color:var(--muted)}
.prompt{margin:12px 0;padding:12px 14px;border-radius:12px;background:var(--soft);font-size:15px}
.choices{display:grid;gap:8px}.choice{padding:9px 11px;border:1px solid var(--border);border-radius:10px;background:#fff;font-size:15px}
.choice label{cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.block{font-size:13px;font-weight:bold}
select,textarea{width:100%;margin-top:5px;padding:9px;border:1px solid var(--border);border-radius:10px;background:#fff;font:inherit}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{border:0;border-radius:10px;padding:9px 13px;font-size:14px;cursor:pointer}
.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--border);color:var(--text)}.next{display:none;background:var(--teal);color:#fff}
.feedback,.hint,.code{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px}
.feedback{background:var(--soft);border:1px solid #cad8ef}.hint{background:var(--warning);border:1px solid #ecd79c}.code{background:var(--success);border:1px solid #b9dec5;text-align:center}
.code strong{display:block;color:var(--teal);font-size:20px;margin-top:2px}.success{text-align:center}.unlock{font-size:40px}
.final-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.header{grid-template-columns:1fr}.status{text-align:left}.progress{width:100%}.grid2,.final-grid{grid-template-columns:1fr}h1{font-size:18px}h2{font-size:19px}.stage{padding:14px}}
</style>

</head>
<body>
<div class="app">
<header class="header">
<div><span class="badge">Unidad 5 · Diseño instruccional</span><h1>Escape Room: Operación Rescata el Curso</h1></div>
<div class="status"><div>Reto 2 de 3</div><div class="progress"><div style="width:33%"></div></div></div>
</header>
<main class="stage"><div class="inner">
<div class="head"><div class="num">2</div><div><h2>El laboratorio tecnológico</h2><div class="topic">Tema 5.2</div></div></div>
<div class="prompt">Relaciona cada necesidad con la herramienta más pertinente.</div>
<div class="grid2">
<label class="block">Organizar contenidos y actividades<select id="t1"><option value="">Selecciona...</option><option>Canvas</option><option>Canva</option><option>Genially</option><option>Padlet</option></select></label>
<label class="block">Diseñar una infografía<select id="t2"><option value="">Selecciona...</option><option>Canvas</option><option>Canva</option><option>Genially</option><option>Padlet</option></select></label>
<label class="block">Crear un caso interactivo<select id="t3"><option value="">Selecciona...</option><option>Canvas</option><option>Canva</option><option>Genially</option><option>Padlet</option></select></label>
<label class="block">Compartir soluciones del grupo<select id="t4"><option value="">Selecciona...</option><option>Canvas</option><option>Canva</option><option>Genially</option><option>Padlet</option></select></label>
</div>
<div class="actions"><button id="check" class="primary">Comprobar relación</button><button id="hintBtn" class="secondary">Pista</button><button id="next" class="next">Continuar al reto 3 →</button></div>
<div id="feedback" class="feedback"></div><div id="hint" class="hint">Canvas organiza, Canva diseña, Genially hace interactivo y Padlet facilita compartir.</div><div id="code" class="code">Código desbloqueado<strong>ALINEAR</strong></div>
</div></main>
</div>
<script>
const $=id=>document.getElementById(id);
$('hintBtn').onclick=()=>$('hint').style.display=$('hint').style.display==='block'?'none':'block';
$('check').onclick=()=>{const v=[$('t1').value,$('t2').value,$('t3').value,$('t4').value];$('feedback').style.display='block';if(v.some(x=>!x)){$('feedback').textContent='Completa las cuatro relaciones.';return;}const ok=v[0]==='Canvas'&&v[1]==='Canva'&&v[2]==='Genially'&&v[3]==='Padlet';if(ok){$('feedback').innerHTML='<strong>Correcto.</strong> Has desbloqueado el segundo código.';$('code').style.display='block';$('next').style.display='inline-block';$('check').disabled=true;}else{$('feedback').textContent='Alguna relación no es correcta. Revisa la pista.';}};
$('next').onclick=()=>location.href='reto3.html';
</script>
</body>
</html>
